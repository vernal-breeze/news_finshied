# ============================================================
# 新闻内容采编系统 - Docker Compose 配置
# ============================================================
# 使用方法:
#   开发环境: docker-compose up -d
#   查看日志: docker-compose logs -f backend
#   停止服务: docker-compose down
#   重新构建: docker-compose up -d --build
# ============================================================

services:
  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: news_editor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: news_editor
      POSTGRES_USER: news_editor
      POSTGRES_PASSWORD: news_editor_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_editor -d news_editor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - news_editor_network

  # ---------- 后端 API 服务 ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news_editor_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 数据库 - 连接到 docker-compose 内的 postgres
      DATABASE_URL: postgresql://news_editor:news_editor_password@postgres:5432/news_editor
      # 应用配置
      APP_NAME: 新闻内容采编系统
      APP_VERSION: 1.0.0
      DEBUG: "true"
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 1
      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
      # AI 服务（可选，如未配置则使用模拟模式）
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-ai/DeepSeek-V3}
      # 日志
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # 挂载本地代码目录（开发模式热重载）
      - ./backend:/app
      # 挂载数据目录
      - backend_data:/app/data
    networks:
      - news_editor_network

  # ---------- 前端 Web 服务 ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news_editor_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Vite 开发服务器配置（在 Dockerfile 中已处理）
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - news_editor_network

# ============================================================
# 网络配置
# ============================================================
networks:
  news_editor_network:
    driver: bridge
    name: news_editor_network

# ============================================================
# 持久化卷配置
# ============================================================
volumes:
  postgres_data:
    driver: local
    name: news_editor_postgres_data
  backend_data:
    driver: local
    name: news_editor_backend_data
