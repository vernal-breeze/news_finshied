# ============================================================
# 新闻内容采编系统 - Docker Compose 配置 (MySQL 8.0)
# ============================================================
# 使用方法:
#   首次启动:  docker compose up -d --build
#   查看日志:  docker compose logs -f backend
#   停止服务:  docker compose down
#   清除数据:  docker compose down -v  (⚠️ 会删除 MySQL 数据)
#   重新构建:  docker compose up -d --build
# ============================================================

services:
  # ---------- MySQL 8.0 数据库 ----------
  mysql:
    image: mysql:8.0
    platform: linux/arm64/v8          # M1/M2 Mac 兼容
    container_name: news_editor_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-news_editor}
      MYSQL_USER: ${MYSQL_USER:-news_editor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass123}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql                     # 数据持久化
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql  # 初始化脚本
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - news_network

  # ---------- 后端 API 服务 ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news_editor_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # 数据库 - 连接 MySQL
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-news_editor}:${MYSQL_PASSWORD:-apppass123}@mysql:3306/${MYSQL_DATABASE:-news_editor}?charset=utf8mb4
      # 应用配置
      APP_NAME: 新闻内容采编系统
      APP_VERSION: 1.0.0
      DEBUG: "${DEBUG:-true}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
      # AI 服务（可选）
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-ai/DeepSeek-V3}
      # 日志
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./backend:/app                 # 挂载代码（开发热重载）
      - backend_data:/app/data         # 数据目录持久化
    networks:
      - news_network

  # ---------- 前端 Web 服务 ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news_editor_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - news_network

# ============================================================
# 网络
# ============================================================
networks:
  news_network:
    driver: bridge
    name: news_editor_network

# ============================================================
# 持久化卷
# ============================================================
volumes:
  mysql_data:
    driver: local
    name: news_editor_mysql_data
  backend_data:
    driver: local
    name: news_editor_backend_data
